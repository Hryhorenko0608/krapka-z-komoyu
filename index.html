<title>Клуб крапки з комою</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: the page IS a sheet — column letters on top, row numbers down the left, a formula bar as the hero; content sits in "cells" */
:root{
  --paper:#fcfdfc;
  --grid:#dde3de;
  --head:#f0f3f1;
  --ink:#16221b;
  --muted:#5d6b62;
  --select:#2a5bd7;
  --cf:#b7e1cd;          /* conditional-format green */
  --cf-ink:#0e3b26;
  --err:#c5221f;
  --display:"Unbounded", "Arial Black", sans-serif;
  --body:"Golos Text", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --cell:34px;
  --peer1:#d9630b;
  --peer2:#8b3ad6;
  --peer3:#0f8a7a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121614;--grid:#262e29;--head:#1a201c;--ink:#e6ede8;--muted:#93a198;--select:#7aa2ff;--cf:#1f5a3d;--cf-ink:#d4f5e3;--err:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121614;--grid:#262e29;--head:#1a201c;--ink:#e6ede8;--muted:#93a198;--select:#7aa2ff;--cf:#1f5a3d;--cf-ink:#d4f5e3;--err:#ff7b72;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px var(--cell);background-position:43px 23px}
.usercell,.cell-editor{position:absolute;left:0;top:0;width:120px;height:34px;z-index:14;font:500 13px var(--mono);display:flex;align-items:center;padding:0 6px;white-space:nowrap}
.usercell{color:var(--ink);cursor:cell;overflow:visible}
.usercell.num{justify-content:flex-end}
.usercell.bad{color:var(--err);font-weight:700}
.cell-editor{border:2px solid var(--select);background:var(--paper);color:var(--ink);outline:0;z-index:16}
.content,.sheet{cursor:cell}
.hint-line{margin-top:14px;font:500 12px var(--mono);color:var(--muted)}
.colhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;background:var(--head);border-bottom:1px solid var(--grid);font:500 11px var(--mono);color:var(--muted);height:24px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--head)}
.colhead span{flex:0 0 120px;display:grid;place-items:center;border-right:1px solid var(--grid)}
.colhead span:first-child{flex-basis:44px}
.colhead span.on{background:var(--cf);color:var(--cf-ink)}
.sheet{display:grid;grid-template-columns:44px 1fr}
.rownums{background:var(--head);border-right:1px solid var(--grid);font:500 11px var(--mono);color:var(--muted)}
.rownums div{height:var(--cell);display:grid;place-items:center;border-bottom:1px solid var(--grid)}
.content{min-width:0;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:16px}
.wrap{max-width:1040px;margin:0 auto}

/* formula bar */
.fbar{margin-top:var(--cell);display:flex;align-items:stretch;border:1px solid var(--grid);background:var(--paper);height:var(--cell);font:14px var(--mono)}
.fbar .ref{width:64px;display:grid;place-items:center;border-right:1px solid var(--grid);color:var(--muted)}
.fbar .fx{width:38px;display:grid;place-items:center;border-right:1px solid var(--grid);font-style:italic;color:var(--muted)}
.fbar .txt{flex:1;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;min-width:0}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--select);margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fn{color:#b5591a}.str{color:#1f7a45}.sep{color:var(--select);font-weight:700}
:root[data-theme="dark"] .fn{color:#ffb070}:root[data-theme="dark"] .str{color:#7fd6a2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fn{color:#ffb070}:root:not([data-theme="light"]) .str{color:#7fd6a2}}

.hero{position:relative;padding-block:calc(var(--cell)*1.5) calc(var(--cell)*2)}
.hero .tag{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero h1{margin:.2em 0 0;font-family:var(--display);font-weight:900;font-size:clamp(46px,9.5vw,124px);line-height:.9;letter-spacing:-.04em;text-wrap:balance}
.hero h1 .semi{display:inline-block;color:var(--select);border:3px solid var(--select);padding:0 .12em;margin-left:.04em;position:relative;background:var(--paper)}
.semi .handle{position:absolute;right:-9px;bottom:-9px;width:14px;height:14px;background:var(--select);border:2px solid var(--paper);padding:0;cursor:crosshair;z-index:2;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.35)}}
.semi .ghost{position:absolute;left:-3px;right:-3px;height:100%;border:2px dashed var(--select);display:grid;place-items:center;color:var(--select);opacity:0;animation:ghost 1.8s ease-out forwards;pointer-events:none}
@keyframes ghost{0%{opacity:0;transform:translateY(-12px)}15%{opacity:.9;transform:none}70%{opacity:.9}100%{opacity:0}}
.semi .tip{position:absolute;left:calc(100% + 14px);top:0;font:500 12px var(--mono);letter-spacing:0;white-space:nowrap;background:var(--ink);color:var(--paper);padding:4px 8px;opacity:0;animation:ghost 1.8s ease-out forwards}
.hero p.lead{max-width:56ch;font-size:19px;margin:calc(var(--cell)*.8) 0 0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:var(--cell)}
.btn{font:600 15px var(--body);border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;cursor:pointer;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,.cell input:focus-visible,select:focus-visible{outline:2px solid var(--select);outline-offset:2px}

section{padding-block:calc(var(--cell)*1.5)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,40px);letter-spacing:-.03em;line-height:1.05;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 calc(var(--cell)*.8);max-width:60ch}

/* quiz sheet */
.mini{border:1px solid var(--grid);background:var(--paper);overflow-x:auto}
.mini table{border-collapse:collapse;width:100%;min-width:520px;font:14px var(--mono)}
.mini th,.mini td{border:1px solid var(--grid);height:40px;padding:0 10px;text-align:left}
.mini th{background:var(--head);color:var(--muted);font-weight:500;font-size:11px;text-align:center;width:44px}
.mini thead th{height:24px}
.mini td.lbl{font-family:var(--body);font-size:15px;width:46%}
.cell input,.cell select{width:100%;height:38px;border:0;background:transparent;color:var(--ink);font:500 15px var(--mono)}
.cell:focus-within{outline:2px solid var(--select);outline-offset:-2px}
tr.result td{background:var(--cf);color:var(--cf-ink);font-weight:700}
tr.result td.lbl{font-weight:600}
.rank{font-family:var(--body);font-size:17px}
.flash{animation:flash .5s ease-out}
@keyframes flash{from{background:#fff3b0}}
.formula{font:12px var(--mono);color:var(--muted);margin-top:8px;overflow-wrap:anywhere}

/* manifesto */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0;border-top:1px solid var(--ink)}
.rule{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:16px 4px;border-bottom:1px solid var(--grid);background:var(--paper)}
.rule .n{font:700 13px var(--mono);color:var(--select)}
.rule b{display:block;font-size:17px;letter-spacing:-.01em}
.rule span{color:var(--muted);font-size:15px}

/* errors */
.errs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.err{border:1px solid var(--grid);background:var(--paper);padding:16px;position:relative;cursor:pointer;transition:background .35s,border-color .35s}
.err code{display:inline-block}
.err.shake code{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px) rotate(-2deg)}40%,80%{transform:translateX(5px) rotate(2deg)}}
.err.fixed{background:var(--cf);border-color:var(--cf)}
.err.fixed::before{display:none}
.err.fixed code{color:var(--cf-ink);font-size:17px;overflow-wrap:anywhere}
.err.fixed p,.err.fixed small{color:var(--cf-ink)}
.peer{position:absolute;left:0;top:0;width:120px;height:34px;border:2px solid var(--pc);z-index:15;pointer-events:none;transition:transform .7s cubic-bezier(.3,.8,.2,1);font:500 13px var(--mono);display:flex;align-items:center;padding:0 6px;color:var(--ink);overflow:hidden;white-space:nowrap;overflow:visible}
.peer .who{position:absolute;bottom:100%;left:-2px;background:var(--pc);color:#fff;font:600 10px var(--mono);padding:2px 6px;white-space:nowrap}
.peer .ink{overflow:hidden;max-width:104px}
.err::before{content:"";position:absolute;right:0;top:0;border:7px solid transparent;border-top-color:var(--err);border-right-color:var(--err)}
.err code{font:700 22px var(--mono);color:var(--err)}
.err p{margin:8px 0 0;font-size:15px}
.err small{display:block;margin-top:8px;font:12px var(--mono);color:var(--muted)}

/* join */
.join{border:2px solid var(--ink);background:var(--paper);padding:calc(var(--cell)*.9);display:grid;gap:16px;grid-template-columns:1fr auto;align-items:center}
.join h2{margin:0}
.join p{margin:4px 0 0;color:var(--muted)}
#joined{font:600 15px var(--mono);color:var(--cf-ink);background:var(--cf);padding:8px 12px}
.join-form{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.join-form .fbar{margin:0;min-width:240px;flex:1}
.join-form .fbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px var(--mono);padding:0 10px;height:100%}
.join-form .fbar:focus-within{outline:2px solid var(--select);outline-offset:-1px}
.join-form .btn:disabled{opacity:.6;cursor:wait}
.reg{margin-top:calc(var(--cell)*.8)}
.reg-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.reg-head h3{margin:0;font:700 18px var(--display);letter-spacing:-.02em}
#reg-count{font:500 12px var(--mono);color:var(--muted)}
.reg .mini{max-height:calc(var(--cell)*9);overflow:auto}
.reg thead th{width:auto;text-align:left;padding:0 10px;position:sticky;top:0}
.reg thead th:first-child,.reg tbody th{width:44px;text-align:center;padding:0}
.reg td{font-family:var(--mono);font-size:14px}
.reg td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums;width:110px}
.reg tr.me td{background:var(--cf);color:var(--cf-ink);font-weight:700}
.reg-note{margin:8px 0 0;font:500 13px var(--mono);color:var(--muted)}
.reg-note:empty{display:none}
footer{padding-block:calc(var(--cell)*1.5);font:12px var(--mono);color:var(--muted)}

.sweep{position:fixed;inset:0;pointer-events:none;z-index:30;display:grid;grid-template-columns:repeat(auto-fill,120px);grid-auto-rows:var(--cell)}
.sweep i{background:var(--cf);opacity:0;animation:cf .9s ease-out forwards}
@keyframes cf{20%{opacity:.85}100%{opacity:0}}

/* gate */
#gate{position:fixed;inset:0;z-index:100;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:120px var(--cell);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));transition:opacity .6s,visibility .6s}
#gate.open{opacity:0;visibility:hidden}
.lock{width:min(520px,100%);background:var(--paper);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:28px}
.lock .badge{display:inline-flex;gap:8px;align-items:center;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--head);border:1px solid var(--grid);padding:4px 8px;color:var(--muted)}
.lock h2{margin:16px 0 8px;font-size:clamp(24px,5vw,32px)}
.lock .q{font-size:18px;margin:0 0 18px}
.lock .fbar{margin:0}
.lock .fbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px var(--mono);padding:0 10px;height:100%}
.lock .fbar:focus-within{outline:2px solid var(--select);outline-offset:-1px}
.lock .row{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
#gate-msg{font:500 13px var(--mono);color:var(--err);min-height:1.4em}
#gate-msg.hint{color:var(--muted)}
.lock.shake{animation:shake .45s}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,30px);z-index:120;background:var(--err);color:#fff;font:600 15px var(--body);padding:12px 18px;box-shadow:4px 4px 0 var(--ink);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1);max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:var(--select)}
body.quake .wrap{animation:shake .4s}
.relock{background:none;border:0;color:var(--muted);font:12px var(--mono);text-decoration:underline;cursor:pointer;padding:0}
@media (max-width:640px){
  .sheet{grid-template-columns:28px 1fr}.colhead span:first-child{flex-basis:28px}
  body{background-position:27px 23px}
  .rownums div{font-size:9px}
  .join{grid-template-columns:1fr}
  .fbar .ref{width:46px}
}
/* Таблікс */
#tetris{position:fixed;inset:0;z-index:90;background:rgba(10,16,12,.55);display:grid;place-items:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
#tetris[hidden]{display:none!important}
.tx-win{background:var(--paper);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);max-width:100%;animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.tx-top{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--grid);background:var(--head);font:12px var(--mono);color:var(--muted)}
.tx-top b{font:700 14px var(--display);color:var(--ink)}
.tx-top span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-x{border:0;background:none;color:var(--ink);font-size:18px;cursor:pointer;padding:2px 6px}
.tx-win .fbar{margin:0;border-width:0 0 1px}
.tx-body{display:flex;gap:16px;padding:14px;align-items:flex-start}
#tx-board{display:block;border:1px solid var(--grid);touch-action:none;outline:0}
.tx-side{display:flex;flex-direction:column;gap:10px;min-width:160px}
.tx-lbl{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
#tx-next{border:1px solid var(--grid);display:block}
.tx-tab{border-collapse:collapse;font:13px var(--mono);width:100%}
.tx-tab th,.tx-tab td{border:1px solid var(--grid);padding:4px 8px;height:30px}
.tx-tab th{background:var(--head);color:var(--muted);font-weight:500;text-align:left}
.tx-tab td{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tx-keys{font:11px/1.7 var(--mono);color:var(--muted)}
.tx-lb{width:230px;min-width:0}
.lb th{text-align:left}
.lb td{font-weight:500}
.lb td:first-child{text-align:center;width:34px;color:var(--muted)}
.lb td:nth-child(2){text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb td:last-child{font-weight:700}
.lb tr:nth-child(1) td:first-child{color:#b8860b;font-weight:700}
.lb tr.me td{background:var(--cf);color:var(--cf-ink)}
.lb-note{margin:8px 0 0;font:12px/1.5 var(--mono);color:var(--muted)}
.lb-note:empty{display:none}
@media (max-width:640px){.tx-lb{width:100%}}
.tx-pad{display:none;gap:8px;padding:0 14px 14px;justify-content:center}
.tx-pad button{flex:1;max-width:64px;height:50px;font:700 18px var(--mono);border:1.5px solid var(--ink);background:var(--head);color:var(--ink);cursor:pointer;touch-action:manipulation}
@media (max-width:640px),(pointer:coarse){.tx-pad{display:flex}}
@media (max-width:640px){.tx-body{flex-direction:column;align-items:center;gap:10px}.tx-side{flex-direction:row;flex-wrap:wrap;align-items:flex-start;min-width:0;width:100%}.tx-tab{width:auto;flex:1}.tx-keys{display:none}.tx-top span{display:none}}
/* cracks + damage report */
#cracks{position:fixed;inset:0;z-index:198;pointer-events:none;width:100%;height:100%}
#cracks path{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;animation:crack .25s ease-out both}
@keyframes crack{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.dmg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-2deg);z-index:120;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--err);padding:20px 24px;width:min(380px,calc(100vw - 32px));font:14px var(--mono)}
.dmg h3{margin:0 0 10px;font:900 22px var(--display);color:var(--err);letter-spacing:-.02em}
.dmg table{width:100%;border-collapse:collapse}
.dmg td{border-bottom:1px dashed var(--grid);padding:6px 0}
.dmg td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.dmg .btn{margin-top:14px}
/* live cursors */
.live{position:absolute;left:0;top:0;z-index:17;pointer-events:none;transition:transform .12s linear}
.live svg{position:absolute;left:0;top:0;width:18px;height:18px}
.live span{position:absolute;left:14px;top:16px;background:var(--lc);color:#fff;font:600 11px var(--mono);padding:2px 7px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.live-cell{position:absolute;left:0;top:0;width:120px;height:34px;border:2px solid var(--lc);z-index:13;pointer-events:none;transition:transform .12s linear}
#online:empty{display:none}
/* challenge */
.chal{border:2px solid var(--ink);background:var(--paper);padding:calc(var(--cell)*.8)}
.chal-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 13px var(--mono);color:var(--muted)}
.chal-src{margin:14px 0 6px;font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chal-q{font:600 clamp(15px,2.2vw,22px) var(--mono);overflow-wrap:anywhere;padding:12px;background:var(--head);border:1px dashed var(--grid)}
.chal-q .c{color:var(--err);font-weight:800}
.chal .fbar{margin-top:12px}
.chal .fbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px var(--mono);padding:0 10px;height:100%}
.chal .fbar:focus-within{outline:2px solid var(--select);outline-offset:-1px}
.timer{height:8px;background:var(--grid);margin-top:12px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--select);transform-origin:left}
.timer.hot i{background:var(--err)}
.chal-res{margin-top:12px;font:600 15px var(--body);min-height:1.5em}
.chal-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;align-items:center}
.streak{font:900 28px var(--display)}
/* certificate */
#cert{position:fixed;inset:0;z-index:95;background:rgba(10,16,12,.6);display:grid;place-items:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
#cert[hidden]{display:none!important}
.cert-win{background:var(--paper);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:16px;display:grid;gap:12px;justify-items:center;max-width:100%}
.cert-win img{height:min(68vh,640px);width:auto;max-width:100%;border:1px solid var(--grid)}
.cert-win .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cert-hint{margin:0;font:12px/1.5 var(--mono);color:var(--muted);text-align:center;max-width:360px}
/* chaos */
body.chaos .wrap{animation:tilt 3s ease-in-out infinite}
@keyframes tilt{25%{transform:rotate(-.7deg)}75%{transform:rotate(.7deg)}}
body.chaos .colhead span{animation:flick .6s steps(2) infinite}
@keyframes flick{50%{background:var(--err);color:#fff}}
